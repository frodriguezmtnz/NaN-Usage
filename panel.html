<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NaN Usage</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="pulse"></span>NaN <small>USAGE</small></div>
      <div class="actions">
        <button id="theme-toggle" class="icon theme-toggle" title="Tema (auto / claro / oscuro)" aria-label="Cambiar tema">
          <svg class="i-auto" viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="15" height="15"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="refresh" class="icon" title="Actualizar" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="open" class="icon" title="Abrir dashboard" aria-label="Abrir dashboard">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>
    <div id="banner" hidden></div>
    <main id="main"><div class="skeleton"></div><div class="skeleton short"></div></main>
    <footer>
      <span id="updated"></span>
      <button id="buy" class="link">+ Comprar créditos</button>
    </footer>
    <script type="module" src="panel.js"></script>
  </body>
</html>
